name: Deploy console to production

# Runs on every push/merge to `development`.
# Builds the console image on the runner, pushes it to GHCR and rolls it out on
# the CloudPe VM (https://app.chargeveta.in) with charveta's
# deploy/cloudpe/deploy.sh: health check and automatic rollback.
# NEXT_PUBLIC_* are inlined into the browser bundle at build time, so the
# production values are set here, not on the VM.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-prod-console
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chargeveta-console

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://app.chargeveta.in/api/v1
            NEXT_PUBLIC_REALTIME_URL=https://app.chargeveta.in
            NEXT_PUBLIC_REALTIME_PATH=/realtime
            NEXT_PUBLIC_APP_NAME=ChargeVeta
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:prod
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Roll out on the VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.CLOUDPE_HOST }}
          username: ${{ secrets.CLOUDPE_USER }}
          key: ${{ secrets.CLOUDPE_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null' EXIT
            ~/chargeveta-prod/deploy.sh console "$IMAGE"

      - name: Public check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://app.chargeveta.in/driver/sign-in)
            [ "$code" = 200 ] && { echo "app.chargeveta.in reachable (200)"; exit 0; }
            sleep 3
          done
          echo "app.chargeveta.in not reachable publicly (last code $code)"; exit 1
